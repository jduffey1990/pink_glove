# no-mistakes gate configuration. Read from the copy on main, so a change here
# takes effect only after it merges (see docs: reference/repo-config).
# The gate daemon runs on the developer's machine, which is why the commands
# below assume the local toolchain and the compose Postgres from app/.

agent: claude

commands:
  # The run worktree starts from tracked files only, so build the venv fresh.
  # Absolute interpreter path: the launchd daemon does not inherit the shell PATH.
  prepare: "cd app && /opt/homebrew/bin/python3.13 -m venv .venv && .venv/bin/pip install -q \".[dev]\""
  lint: "cd app && .venv/bin/ruff check . && .venv/bin/ruff format --check ."
  format: "cd app && .venv/bin/ruff format ."
  # Backend suite against the local compose database (`docker compose up -d db` in app/),
  # the same way README.md runs it. Frontend lint, type-check, vitest, the schema
  # contract checks, and the image build stay in CI, which the ci step waits on.
  test: "cd app && DATABASE_URL=postgres://pink_glove:pink_glove@localhost:5432/pink_glove .venv/bin/pytest -q"

# Generated by the schema check (ADR-019); the reviewer should not read them as hand-written.
ignore_patterns:
  - "ui/openapi.yaml"
  - "ui/src/api/schema.d.ts"

review:
  # The reviewer may ask Jordan questions in the TUI instead of guessing intent.
  conversation: true
  path_instructions:
    - path: "app/**"
      instructions: |
        Check every change against the invariants in CLAUDE.md, especially tenant
        scoping at the chokepoint, integer cents, UTC storage, and nothing issued
        is edited. A violation is a blocking finding, not a suggestion.
    - path: "docs/**"
      instructions: |
        Prose changes only. Do not request test coverage.

pr:
  # The repo is public. Keep the transcript-derived Intent section out of PR bodies.
  publish_intent: false

ci:
  # Every CI repair goes back through review before it is published.
  revalidate_repairs: true
