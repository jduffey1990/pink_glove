          maximum: 32767
          minimum: 0
          nullable: true
        bathrooms:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
          description: Half baths as .5
        parking_notes:
          type: string
        access_notes:
          type: string
          description: Non-sensitive entry instructions.
        gate_code:
          type: string
          writeOnly: true
        alarm_code:
          type: string
          writeOnly: true
        key_location:
          type: string
          writeOnly: true
        has_pets:
          type: boolean
        pet_notes:
          type: string
        is_active:
          type: boolean
      required:
      - city
      - customer
      - line1
      - postal_code
      - state
    ServiceLocationSummary:
      type: object
      description: |-
        Nested inside a customer. Deliberately omits the encrypted access fields:
        a list of customers should not spray gate codes across the wire.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
          description: e.g. "Home", "Rental - Oak St".
        one_line_address:
          type: string
          readOnly: true
        square_feet:
          type: integer
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - id
      - is_active
      - label
      - one_line_address
      - square_feet
    ServiceRequest:
      type: object
      description: |-
        Base serializer for tenant-owned models.

        `organization` is read-only: the viewset supplies it. Belt and braces
        alongside `TenantViewSetMixin.perform_create`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        pricing_model:
          $ref: '#/components/schemas/PricingModelEnum'
        base_price_cents:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Flat price, or the minimum charge for other models.
        hourly_rate_cents:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Cents per hour. Used when pricing model is Hourly.
        per_sqft_rate_cents:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Cents per square foot. Used when pricing model is Per square
            foot.
        default_duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Used to lay out the schedule before actual times are known.
        is_active:
          type: boolean
        is_taxable:
          type: boolean
          description: Whether sales tax applies to this service.
      required:
      - name
    ServiceSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        default_duration_minutes:
          type: integer
          readOnly: true
          description: Used to lay out the schedule before actual times are known.
      required:
      - default_duration_minutes
      - id
      - name
    Session:
      type: object
      description: |-
        What the frontend needs to render a signed-in shell.

        Includes every membership so a multi-organization user can be offered a
        switcher; the active one is echoed back as `current_organization`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          readOnly: true
        current_organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationSummary'
          nullable: true
          readOnly: true
        current_role:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - current_organization
      - current_role
      - email
      - first_name
      - full_name
      - id
      - is_superuser
      - last_name
      - memberships
      - phone
    StatusChangeRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        reason:
          type: string
          default: ''
      required:
      - status
    TimeEntry:
      type: object
      description: |-
        Base serializer for tenant-owned models.

        `organization` is read-only: the viewset supplies it. Belt and braces
        alongside `TenantViewSetMixin.perform_create`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        job:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        user_name:
          type: string
          readOnly: true
        clock_in:
          type: string
          format: date-time
        clock_out:
          type: string
          format: date-time
          nullable: true
        duration_minutes:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - clock_in
      - created_at
      - duration_minutes
      - id
      - job
      - user
      - user_name
    VerifyRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        remember_device:
          type: boolean
          default: false
          description: Skip the code on this device until the trusted-device cookie
            expires.
      required:
      - code
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
