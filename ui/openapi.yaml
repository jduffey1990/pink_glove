  /api/billing/payments/:
    get:
      operationId: billing_payments_list
      description: |-
        The ledger. Write once, then void with a reason -- no PATCH, no DELETE
        (ADR-025).
      parameters:
      - in: query
        name: invoice
        schema:
          type: string
          format: uuid
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: method
        schema:
          type: array
          items:
            type: string
            enum:
            - card
            - cash
            - check
            - money_order
            - other
            - zelle
        description: |-
          * `cash` - Cash
          * `check` - Check
          * `money_order` - Money order
          * `zelle` - Zelle
          * `card` - Card
          * `other` - Other
        explode: true
        style: form
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: received_from
        schema:
          type: string
          format: date
      - in: query
        name: received_to
        schema:
          type: string
          format: date
      - in: query
        name: voided
        schema:
          type: boolean
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
    post:
      operationId: billing_payments_create
      description: |-
        The ledger. Write once, then void with a reason -- no PATCH, no DELETE
        (ADR-025).
      summary: Record money received against an invoice
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
        '400':
          content:
