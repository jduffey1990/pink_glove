          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignments
      - cancellation_reason
      - created_at
      - customer
      - customer_detail
      - duration_minutes
      - id
      - is_terminal
      - location
      - location_detail
      - next_statuses
      - open_time_entry
      - organization
