          type: string
          maxLength: 255
        billing_state:
          type: string
          maxLength: 100
        billing_postal_code:
          type: string
          maxLength: 30
        billing_country:
          type: string
          maxLength: 2
        status:
          $ref: '#/components/schemas/CustomerStatusEnum'
