          readOnly: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_terminal:
          type: boolean
          readOnly: true
        next_statuses:
          type: array
          items:
            $ref: '#/components/schemas/NextStatus'
          readOnly: true
        price_cents:
