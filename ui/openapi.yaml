          type: string
          description: How they found you.
          maxLength: 255
        notes:
          type: string
    PatchedInvoiceLineRequest:
      type: object
      description: |-
        A line. Only an adjustment is writable from scratch: visit and fee lines
        are built by `draft_invoice` from the visit itself, and a hand-typed
        "visit" line would be a number with no job behind it.
      properties:
        invoice:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/LineKindEnum'
        description:
          type: string
          minLength: 1
          maxLength: 255
        amount_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_taxable:
          type: boolean
        position:
          type: integer
          maximum: 32767
          minimum: 0
    PatchedInvoiceRequest:
      type: object
      description: |-
        The dispatcher's view of an invoice.

        `subtotal_cents`, `tax_cents` and `total_cents` are the *stored* snapshot
        on an issued invoice and a live calculation on a draft, which is what
        `services.totals` decides -- so a draft shows what issuing it would come
        to, and an issued invoice shows what the customer was sent.
      properties:
        notes:
          type: string
    PatchedJobNoteRequest:
      type: object
      description: |-
        Base serializer for tenant-owned models.

        `organization` is read-only: the viewset supplies it. Belt and braces
        alongside `TenantViewSetMixin.perform_create`.
      properties:
        job:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
    PatchedJobPhotoRequest:
      type: object
      description: |-
        Base serializer for tenant-owned models.

        `organization` is read-only: the viewset supplies it. Belt and braces
        alongside `TenantViewSetMixin.perform_create`.
      properties:
        job:
          type: string
          format: uuid
        image:
          type: string
          format: binary
        caption:
          type: string
          maxLength: 255
    PatchedJobRequest:
      type: object
      description: |-
        The dispatcher's and cleaner's view of a visit.

        Writes take plain ids for customer/location/service; reads get the nested
        summaries. `price_cents` is optional on write and quoted from the service
        when omitted.
      properties:
        customer:
          type: string
          format: uuid
        location:
          type: string
          format: uuid
        service:
          type: string
          format: uuid
        scheduled_start:
          type: string
          format: date-time
        scheduled_end:
          type: string
          format: date-time
        price_cents:
          type: integer
          maximum: 2147483647
          minimum: 0
        notes:
          type: string
    PatchedOrganizationRequest:
      type: object
      description: |-
        The organization as its own admins see it.

        Writes are gated to admin+ by `CurrentOrganizationView.get_permissions`,
        so the operating-window fields need no further permission handling here.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        timezone:
          type: string
          minLength: 1
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
        address_line1:
          type: string
          maxLength: 255
        address_line2:
          type: string
          maxLength: 255
        address_city:
          type: string
          maxLength: 255
        address_state:
          type: string
          maxLength: 100
        address_postal_code:
          type: string
          maxLength: 30
        address_country:
          type: string
          maxLength: 2
        logo:
          type: string
          format: binary
          nullable: true
        primary_color:
          type: string
          maxLength: 7
        business_hours_start:
          type: string
          format: time
        business_hours_end:
          type: string
          format: time
        working_days:
          type: array
          items:
            type: integer
            maximum: 7
            minimum: 1
