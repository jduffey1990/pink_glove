  /api/scheduling/jobs/:
    get:
      operationId: scheduling_jobs_list
      description: |-
        Visits.

        The queryset is role-scoped on top of the tenant scope: a cleaner sees the
        jobs they are on, a customer sees their own, a dispatcher sees everything.
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
          format: uuid
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: location
        schema:
          type: string
          format: uuid
      - in: query
        name: mine
        schema:
          type: boolean
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: plan
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - cancelled
            - complete
            - en_route
            - in_progress
            - no_access
            - scheduled
        description: |-
          * `scheduled` - Scheduled
          * `en_route` - En route
          * `in_progress` - In progress
          * `complete` - Complete
          * `cancelled` - Cancelled
          * `no_access` - No access
        explode: true
        style: form
      tags:
      - scheduling
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobList'
