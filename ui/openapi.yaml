        reveal_buffer_before_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        reveal_buffer_after_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        tax_rate_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          description: Sales tax rate as a percentage, e.g. 8.250 for 8.25%.
        no_access_fee_type:
          $ref: '#/components/schemas/NoAccessFeeTypeEnum'
        no_access_fee_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          description: Cents when the fee is flat, a percentage when it is proportional.
        invoice_prefix:
          type: string
          minLength: 1
          description: Prefix on invoice numbers, e.g. INV-0001.
          maxLength: 8
        invoice_terms_days:
          type: integer
          maximum: 32767
          minimum: 0
          description: Days from issue to the due date.
        invoice_footer:
          type: string
          description: Printed at the foot of every invoice, e.g. "Make checks payable
            to ...".
