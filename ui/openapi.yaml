openapi: 3.0.3
info:
  title: pink_glove API
  version: 0.1.0
  description: CRM, scheduling, and billing for cleaning companies.
paths:
  /api/audit/access-reveals/:
    get:
      operationId: audit_access_reveals_list
      description: |-
        The audit trail. Read-only by construction -- there is no update or destroy
        route, and the model refuses deletion.

        Admin and owner only: this is the record used to ask a worker why they
        pulled a code at 11pm, so the people being recorded should not be able to
        curate it.
      parameters:
      - in: query
        name: acknowledged
        schema:
          type: boolean
      - in: query
        name: is_flagged
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: location
        schema:
          type: string
          format: uuid
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessRevealList'
          description: ''
  /api/audit/access-reveals/{id}/:
    get:
      operationId: audit_access_reveals_retrieve
      description: |-
        The audit trail. Read-only by construction -- there is no update or destroy
        route, and the model refuses deletion.

        Admin and owner only: this is the record used to ask a worker why they
        pulled a code at 11pm, so the people being recorded should not be able to
        curate it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Access reveal.
        required: true
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReveal'
          description: ''
  /api/audit/access-reveals/{id}/review/:
    post:
      operationId: audit_access_reveals_review_create
      description: |-
        Mark a flagged reveal as looked at.

        Closing a flag records who closed it and what they were told. Nothing
        about the original reveal is altered.
      summary: Mark a flagged reveal as looked at
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Access reveal.
        required: true
      tags:
      - audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReveal'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: 200 means the session is established (no 2FA required, or a trusted
        device). 202 means a code was sent and POST /api/auth/verify/ is next.
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeIssued'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/resend/:
    post:
      operationId: auth_resend_create
      summary: Resend the pending sign-in code
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeIssued'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/verify/:
    post:
      operationId: auth_verify_create
      summary: Submit a sign-in code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/billing/invoice-lines/:
    get:
      operationId: billing_invoice_lines_list
      description: |-
        Adjustments on a draft.

        Visit and no-access lines are built by `draft_invoice` from the visit
        itself and are not writable here; a hand-typed visit line would be a number
        with no job behind it. Every write is refused once the invoice is issued.
      parameters:
      - in: query
        name: invoice
        schema:
          type: string
          format: uuid
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - adjustment
          - no_access_fee
          - visit
        description: |-
          * `visit` - Visit
          * `no_access_fee` - No-access fee
          * `adjustment` - Adjustment
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceLineList'
          description: ''
    post:
      operationId: billing_invoice_lines_create
      description: |-
        Adjustments on a draft.

        Visit and no-access lines are built by `draft_invoice` from the visit
        itself and are not writable here; a hand-typed visit line would be a number
        with no job behind it. Every write is refused once the invoice is issued.
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceLineRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvoiceLineRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvoiceLineRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLine'
          description: ''
  /api/billing/invoice-lines/{id}/:
    get:
      operationId: billing_invoice_lines_retrieve
      description: |-
        Adjustments on a draft.

        Visit and no-access lines are built by `draft_invoice` from the visit
        itself and are not writable here; a hand-typed visit line would be a number
        with no job behind it. Every write is refused once the invoice is issued.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Invoice line.
        required: true
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLine'
          description: ''
    patch:
      operationId: billing_invoice_lines_partial_update
      description: |-
        Adjustments on a draft.

        Visit and no-access lines are built by `draft_invoice` from the visit
        itself and are not writable here; a hand-typed visit line would be a number
        with no job behind it. Every write is refused once the invoice is issued.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Invoice line.
        required: true
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInvoiceLineRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInvoiceLineRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInvoiceLineRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLine'
          description: ''
    delete:
      operationId: billing_invoice_lines_destroy
      description: |-
        Adjustments on a draft.

        Visit and no-access lines are built by `draft_invoice` from the visit
        itself and are not writable here; a hand-typed visit line would be a number
        with no job behind it. Every write is refused once the invoice is issued.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Invoice line.
        required: true
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/billing/invoice-lines/{id}/reprice/:
    post:
      operationId: billing_invoice_lines_reprice_create
      description: 'Never automatic: a crew running long is not self-evidently the
        customer''s bill, so a person decides (ADR-026). Open time entries are ignored,
        and the line floors at the service''s minimum charge.'
      summary: Re-price an hourly visit from the hours actually worked
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Invoice line.
        required: true
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLine'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/billing/invoices/:
    get:
      operationId: billing_invoices_list
      description: |-
        Invoices. Dispatcher and above.

        Creation does not take a body of lines: it takes a customer and a list of
        visits, and `services.draft_invoice` builds the lines from them. That is
        the only way a line can carry a price nobody typed.
      parameters:
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
      - in: query
        name: issued_from
        schema:
          type: string
          format: date
      - in: query
        name: issued_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: overdue
        schema:
          type: boolean
      - in: query
        name: payment_state
        schema:
          type: string
          enum:
          - paid
          - partial
          - unpaid
        description: |-
          * `unpaid` - Unpaid
          * `partial` - Partly paid
          * `paid` - Paid
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - draft
            - issued
            - void
        description: |-
          * `draft` - Draft
          * `issued` - Issued
          * `void` - Void
        explode: true
        style: form
      tags:
      - billing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceList'
          description: ''
    post:
      operationId: billing_invoices_create
      description: |-
        Invoices. Dispatcher and above.

        Creation does not take a body of lines: it takes a customer and a list of
        visits, and `services.draft_invoice` builds the lines from them. That is
        the only way a line can carry a price nobody typed.
      summary: Open a draft invoice over a customer's uninvoiced visits
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftInvoiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DraftInvoiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DraftInvoiceRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
