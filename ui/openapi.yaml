components:
  schemas:
    AccessReveal:
      type: object
      description: Read-only view of the trail, for admins reviewing end-of-day flags.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        user_name:
          type: string
          readOnly: true
        location:
          type: string
          format: uuid
          readOnly: true
        location_label:
          type: string
          readOnly: true
        job:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        job_scheduled_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        customer_name:
          type: string
          readOnly: true
        fields_revealed:
          readOnly: true
          description: e.g. ["gate_code", "alarm_code"]
        acknowledged:
          type: boolean
          readOnly: true
          description: User confirmed the logging warning before proceeding.
        ip_address:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        evaluated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_flagged:
          type: boolean
          readOnly: true
        flag_reason:
          type: string
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reviewed_by_email:
          type: string
          format: email
          readOnly: true
        review_note:
          type: string
          readOnly: true
      required:
      - acknowledged
      - created_at
      - customer_name
      - evaluated_at
      - fields_revealed
      - flag_reason
      - id
      - ip_address
      - is_flagged
      - job
      - job_scheduled_start
      - location
      - location_label
      - review_note
      - reviewed_at
      - reviewed_by
      - reviewed_by_email
      - user
      - user_agent
      - user_email
      - user_name
    AccessWarning:
      type: object
      description: |-
        The acknowledgement copy, served so the frontend never hardcodes it.

        One string, in one place: the words shown to the user and the words the
        audit row claims they were shown cannot drift apart (ADR-016, ADR-023).
      properties:
        warning:
          type: string
      required:
      - warning
    AcknowledgementRequired:
      type: object
      properties:
        detail:
          type: string
        acknowledgement_required:
          type: boolean
      required:
      - acknowledgement_required
      - detail
    AssignRequest:
      type: object
      properties:
        user:
          type: string
          format: uuid
      required:
      - user
    AvailableActionsEnum:
      enum:
      - edit
      - delete
      - issue
      - void
      - send
      - record_payment
      type: string
      description: |-
        * `edit` - edit
        * `delete` - delete
        * `issue` - issue
        * `void` - void
        * `send` - send
        * `record_payment` - record_payment
    BillableJob:
      type: object
      description: One row of the ready-to-invoice list, priced as it will bill.
      properties:
        id:
          type: string
          format: uuid
        customer:
          type: string
          format: uuid
        customer_name:
          type: string
        service_name:
          type: string
        description:
          type: string
        scheduled_start:
          type: string
          format: date-time
        status:
          type: string
        amount_cents:
          type: integer
      required:
      - amount_cents
      - customer
      - customer_name
      - description
      - id
      - scheduled_start
      - service_name
      - status
    ChallengeIssued:
      type: object
      description: '202 body: a code went out and the client should collect it.'
      properties:
        detail:
          type: string
        two_factor_required:
          type: boolean
          default: true
        dev_code:
          type: string
          description: Local development only. Never present in a deployed environment.
      required:
      - detail
    Customer:
      type: object
      description: |-
        Base serializer for tenant-owned models.

        `organization` is read-only: the viewset supplies it. Belt and braces
        alongside `TenantViewSetMixin.perform_create`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          nullable: true
          description: Set only if this customer has portal access.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        company_name:
          type: string
          description: For commercial accounts.
          maxLength: 255
        display_name:
          type: string
          readOnly: true
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
        preferred_contact_method:
          $ref: '#/components/schemas/PreferredContactMethodEnum'
        billing_line1:
          type: string
          maxLength: 255
        billing_line2:
          type: string
          maxLength: 255
        billing_city:
          type: string
          maxLength: 255
        billing_state:
          type: string
          maxLength: 100
        billing_postal_code:
          type: string
          maxLength: 30
        billing_country:
          type: string
          maxLength: 2
        status:
          $ref: '#/components/schemas/CustomerStatusEnum'
        source:
          type: string
          description: How they found you.
          maxLength: 255
        notes:
          type: string
        locations:
          type: array
          items:
            $ref: '#/components/schemas/ServiceLocationSummary'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - display_name
      - id
      - locations
      - organization
      - updated_at
    CustomerRequest:
      type: object
      description: |-
        Base serializer for tenant-owned models.

        `organization` is read-only: the viewset supplies it. Belt and braces
        alongside `TenantViewSetMixin.perform_create`.
      properties:
        user:
          type: string
          format: uuid
          nullable: true
          description: Set only if this customer has portal access.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        company_name:
          type: string
          description: For commercial accounts.
          maxLength: 255
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 30
        preferred_contact_method:
          $ref: '#/components/schemas/PreferredContactMethodEnum'
        billing_line1:
          type: string
          maxLength: 255
        billing_line2:
          type: string
          maxLength: 255
        billing_city:
          type: string
          maxLength: 255
        billing_state:
          type: string
          maxLength: 100
        billing_postal_code:
          type: string
          maxLength: 30
        billing_country:
          type: string
          maxLength: 2
        status:
          $ref: '#/components/schemas/CustomerStatusEnum'
        source:
          type: string
          description: How they found you.
          maxLength: 255
        notes:
          type: string
    CustomerStatusEnum:
      enum:
      - lead
      - active
      - inactive
      - archived
      type: string
      description: |-
        * `lead` - Lead
        * `active` - Active
        * `inactive` - Inactive
        * `archived` - Archived
    CustomerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        display_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        preferred_contact_method:
          allOf:
          - $ref: '#/components/schemas/PreferredContactMethodEnum'
          readOnly: true
      required:
      - display_name
      - id
      - phone
      - preferred_contact_method
    Detail:
      type: object
      description: 'The `{"detail": "..."}` body DRF and this codebase use for messages.'
      properties:
        detail:
          type: string
      required:
      - detail
    DraftInvoiceRequest:
      type: object
      description: '`POST /api/billing/invoices/` -- a customer and the visits to
        bill.'
      properties:
        customer:
          type: string
          format: uuid
        jobs:
          type: array
          items:
            type: string
            format: uuid
      required:
      - customer
      - jobs
    Invoice:
      type: object
      description: |-
        The dispatcher's view of an invoice.

        `subtotal_cents`, `tax_cents` and `total_cents` are the *stored* snapshot
        on an issued invoice and a live calculation on a draft, which is what
        `services.totals` decides -- so a draft shows what issuing it would come
        to, and an issued invoice shows what the customer was sent.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
        customer_detail:
          allOf:
          - $ref: '#/components/schemas/CustomerSummary'
          readOnly: true
        number:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InvoiceStatusEnum'
          readOnly: true
        issued_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        due_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        bill_to_name:
          type: string
          readOnly: true
        bill_to_email:
          type: string
          format: email
          readOnly: true
        bill_to_address:
          type: string
          readOnly: true
        tax_rate_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,3})?$
          readOnly: true
        subtotal_cents:
          type: integer
          readOnly: true
        tax_cents:
          type: integer
          readOnly: true
        total_cents:
          type: integer
          readOnly: true
        notes:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
          readOnly: true
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          readOnly: true
        payment_state:
          allOf:
          - $ref: '#/components/schemas/PaymentStateEnum'
          readOnly: true
        balance_cents:
          type: integer
          readOnly: true
        is_overdue:
          type: boolean
          readOnly: true
        available_actions:
          type: array
          items:
            $ref: '#/components/schemas/AvailableActionsEnum'
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_by_name:
          type: string
          readOnly: true
        issued_by_name:
          type: string
          readOnly: true
        voided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        void_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - available_actions
      - balance_cents
      - bill_to_address
      - bill_to_email
      - bill_to_name
      - created_at
      - created_by_name
      - customer
      - customer_detail
      - due_on
      - id
      - is_overdue
      - issued_by_name
      - issued_on
      - lines
      - number
      - organization
      - payment_state
      - payments
      - sent_at
      - status
      - subtotal_cents
      - tax_cents
      - tax_rate_percent
      - total_cents
      - updated_at
      - void_reason
      - voided_at
    InvoiceLine:
      type: object
      description: |-
        A line. Only an adjustment is writable from scratch: visit and fee lines
        are built by `draft_invoice` from the visit itself, and a hand-typed
        "visit" line would be a number with no job behind it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        invoice:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/LineKindEnum'
        job:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        description:
          type: string
          maxLength: 255
        amount_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_taxable:
          type: boolean
        position:
          type: integer
          maximum: 32767
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_cents
      - created_at
      - description
      - id
      - invoice
      - job
      - kind
      - organization
      - updated_at
    InvoiceLineRequest:
      type: object
      description: |-
        A line. Only an adjustment is writable from scratch: visit and fee lines
        are built by `draft_invoice` from the visit itself, and a hand-typed
        "visit" line would be a number with no job behind it.
      properties:
        invoice:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/LineKindEnum'
        description:
          type: string
          minLength: 1
          maxLength: 255
        amount_cents:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_taxable:
          type: boolean
        position:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - amount_cents
      - description
      - invoice
      - kind
    InvoiceStatusEnum:
      enum:
      - draft
      - issued
      - void
      type: string
      description: |-
        * `draft` - Draft
        * `issued` - Issued
        * `void` - Void
    Job:
      type: object
      description: |-
        The dispatcher's and cleaner's view of a visit.

        Writes take plain ids for customer/location/service; reads get the nested
        summaries. `price_cents` is optional on write and quoted from the service
        when omitted.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
        customer_detail:
          allOf:
          - $ref: '#/components/schemas/CustomerSummary'
          readOnly: true
        location:
          type: string
          format: uuid
        location_detail:
          allOf:
          - $ref: '#/components/schemas/LocationSummary'
          readOnly: true
        service:
          type: string
          format: uuid
        service_detail:
          allOf:
          - $ref: '#/components/schemas/ServiceSummary'
          readOnly: true
        plan:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        plan_occurrence:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: The UTC instant this occurrence was originally planned for.
            Immutable. This, not scheduled_start, is the materializer's idempotency
            key -- a rescheduled job must not be re-created at its old slot.
