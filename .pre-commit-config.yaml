repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^app/
      - id: ruff-format
        files: ^app/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      # Runs the project's own eslint rather than a pinned mirror: the config
      # is eslint-config-vuetify, which has to agree with the versions in
      # ui/package-lock.json. The wrapper picks up ui/.nvmrc and fails with a
      # readable message on an older Node, rather than the TypeError eslint
      # throws from inside a dependency there.
      # ADR-019: the committed schema IS the frontend's contract. Without this,
      # a serializer change without `npm run api:types` leaves it quietly wrong.
      - id: openapi-schema-current
        name: openapi schema is current
        entry: app/bin/check-schema.sh
        language: system
        files: ^app/.*/(serializers|views|urls|models|enums)\.py$
        pass_filenames: false

      - id: ui-eslint
        name: eslint (ui)
        entry: ui/bin/lint.sh
        language: system
        files: ^ui/.*\.(ts|vue|js|mts)$
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      # The source repo shipped a live SECRET_KEY and an API key in settings.py.
      # This is the guard against repeating that.
      - id: gitleaks
