name: pink-glove

x-django: &django
  build:
    # The repository root, not app/: the one Dockerfile builds the frontend
    # too and bakes it into the image (ADR-027).
    context: ..
    dockerfile: Dockerfile
  image: pink-glove:local
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: app.settings.local
    # The image carries a frontend build, but in development the Vite dev
    # server on :3000 is the frontend. Empty means "do not serve it", so a
    # stale build baked in weeks ago cannot be mistaken for the live one.
    UI_DIST_DIR: ""
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    # Live code reload in development. Not present in any deployed environment.
    - .:/code

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pink_glove
      POSTGRES_USER: pink_glove
      POSTGRES_PASSWORD: pink_glove
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pink_glove -d pink_glove"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Runs to completion before web starts, so migrations never race N workers.
  migrate:
    <<: *django
    command: python manage.py migrate --noinput
    restart: "no"

  web:
    <<: *django
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *django
    command: celery -A app worker --loglevel=info --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    <<: *django
    command: celery -A app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The Vite dev server. Development only -- a production image for the UI is
  # deferred with the deploy target (ADR-006).
  #
  # Node 22 because eslint-config-vuetify's toolchain calls Object.groupBy,
  # which does not exist before Node 21. Matches ui/.nvmrc.
  ui:
    image: node:22-alpine
    working_dir: /ui
    # Installs on start so a fresh clone needs no host Node at all. The
    # anonymous volume below keeps the container's linux node_modules from
    # being shadowed by the host's (which are built for the host's platform).
    command: sh -c "npm install --no-fund --no-audit && npm run dev -- --host 0.0.0.0"
    environment:
      # The browser talks to the API directly, so this is the *host's* URL,
      # not the compose service name -- `web` does not resolve in a browser.
      VITE_API_BASE_URL: "http://localhost:8000"
    volumes:
      - ../ui:/ui
      - ui_node_modules:/ui/node_modules
    ports:
      - "3000:3000"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ui_node_modules:
