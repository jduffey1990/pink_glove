# The gate that does not depend on anyone having run `pre-commit install`.
#
# Three jobs mirror what CLAUDE.md asks of every commit -- pytest, ruff and
# the schema check for app/; lint, type-check and vitest for ui/ -- and a
# fourth proves the image still builds, because the image IS the deploy
# artifact (ADR-027). A fifth deploys `main` to staging, and only once Jordan
# has set the FLY_STAGING_APP variable and the FLY_API_TOKEN secret on the
# repository: until then it is skipped, not failed. Production is never
# deployed from here (CLAUDE.md, "Branches and production").

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, ruff, schema, deploy audit)
    runs-on: ubuntu-latest
    # A newer push to the same branch supersedes a running check. Only the
    # check jobs cancel; the deploy job below must never be cut off mid-way.
    concurrency:
      group: check-backend-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pink_glove
          POSTGRES_USER: pink_glove
          POSTGRES_PASSWORD: pink_glove
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pink_glove -d pink_glove"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://pink_glove:pink_glove@localhost:5432/pink_glove
      # The suite uses the in-memory cache and eager Celery; nothing connects
      # to Redis, but the setting has to parse.
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The image's interpreter; pyproject allows newer, the deploy runs this.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install
        run: pip install ".[dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q

      - name: The committed OpenAPI schema is current (ADR-019)
        # The pre-commit hook's own script. A backend change that did not
        # rerun `npm run api:types` fails here rather than on the next
        # developer's machine.
        run: PYTHON=python bin/check-schema.sh

      - name: Deploy audit
        # The same script CLAUDE.md and README name; its values are
        # placeholders that reach no service.
        run: PYTHON=python bin/deploy-audit.sh

  frontend:
    name: Frontend (eslint, vue-tsc, vitest, build)
    runs-on: ubuntu-latest
    concurrency:
      group: check-frontend-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Tests
        run: npm test

      - name: The committed TypeScript contract matches the schema (ADR-019)
        run: |
          npx openapi-typescript openapi.yaml -o /tmp/schema.d.ts
          diff -u src/api/schema.d.ts /tmp/schema.d.ts

      - name: Build
        run: npm run build-only

  image:
    name: Image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    concurrency:
      group: check-image-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy main to staging
    runs-on: ubuntu-latest
    needs: [backend, frontend, image]
    # Inert until Jordan sets the repository variable FLY_STAGING_APP (and the
    # FLY_API_TOKEN secret). See docs/DEPLOY.md.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.FLY_STAGING_APP != ''
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit (tag 1.6): this job holds the deploy token, and a
      # mutable ref would let the action's next push run with it.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Through the environment, never interpolated into the shell line.
          FLY_STAGING_APP: ${{ vars.FLY_STAGING_APP }}
        run: flyctl deploy --remote-only --config deploy/fly.toml --app "$FLY_STAGING_APP"
